name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: npm pack --dry-run
      - run: npm install --global --install-links --prefix "$RUNNER_TEMP/turnback-install" .
      - run: TURNBACK_CLI="$RUNNER_TEMP/turnback-install/bin/turnback" node --test test/terminal.test.mjs
